/* ==========================================================================
   ひより珈琲 デモサイト スタイルシート
   デザイントークン・共通レイアウト・各ページ装飾
   ========================================================================== */

:root {
  /* Color Tokens */
  --bg-base: #FAF6EF;
  --bg-surface: #FFFDF8;
  --text-main: #302D28;
  --text-sub: #625B52;
  --color-green: #24483E;
  --color-green-tint: #E9F0ED;
  --color-brown: #795039;
  --color-brown-tint: #F3ECE6;
  --color-border: #D8CFC2;
  --color-closed: #8B3F35;
  --color-closed-tint: #F9ECEA;
  --color-focus: #245FA5;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, &quot;Hiragino Kaku Gothic ProN&quot;, &quot;Yu Gothic&quot;, Meiryo, sans-serif;
  --font-serif: &quot;Yu Mincho&quot;, &quot;Hiragino Mincho ProN&quot;, serif;

  /* Spacing Scale (4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 80px) */
  --space-4: 4px;
  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-24: 24px;
  --space-32: 32px;
  --space-48: 48px;
  --space-64: 64px;
  --space-80: 80px;

  /* Radius */
  --radius-card: 12px;
  --radius-btn: 8px;
  --radius-label: 4px;

  /* Layout */
  --container-max: 1120px;
  --prose-max: 680px;
  --bottom-bar-height: 64px;
}

/* ==========================================================================
   Reset &amp; Base
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 100%;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  margin: 0;
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 1rem; /* 16px */
  line-height: 1.8;
  overflow-x: hidden;
  padding-bottom: calc(var(--bottom-bar-height) + var(--space-24) + env(safe-area-inset-bottom, 0px));
}

@media (min-width: 768px) {
  body {
    padding-bottom: 0;
  }
}

img,
svg {
  max-width: 100%;
  display: block;
}

/* Focus styles for keyboard accessibility */
:focus-visible {
  outline: 3px solid var(--color-focus);
  outline-offset: 2px;
}

:focus:not(:focus-visible) {
  outline: none;
}

a {
  color: var(--color-green);
  text-decoration: underline;
  text-underline-offset: 4px;
  transition: background-color 0.15s ease, color 0.15s ease;
}

a:hover {
  color: var(--text-main);
}

/* Heading styles */
h1,
h2,
.site-logo {
  font-family: var(--font-serif);
  color: var(--text-main);
  line-height: 1.4;
  margin-top: 0;
}

h1 {
  font-size: 2rem; /* 32px */
  font-weight: 700;
  margin-bottom: var(--space-16);
}

@media (min-width: 768px) {
  h1 {
    font-size: 2.5rem; /* 40px (&lt;= 44px limit) */
  }
}

h2 {
  font-size: 1.375rem; /* 22px */
  font-weight: 700;
  margin-bottom: var(--space-16);
}

@media (min-width: 768px) {
  h2 {
    font-size: 1.625rem; /* 26px */
  }
}

h3 {
  font-family: var(--font-sans);
  font-size: 1.125rem; /* 18px */
  font-weight: 700;
  line-height: 1.5;
  margin-top: 0;
  margin-bottom: var(--space-8);
  color: var(--text-main);
}

p {
  margin-top: 0;
  margin-bottom: var(--space-16);
}

p:last-child {
  margin-bottom: 0;
}

/* Anchor targets scroll margin so fixed bar or edges never obscure headings */
[id] {
  scroll-margin-top: var(--space-24);
  scroll-margin-bottom: calc(var(--bottom-bar-height) + var(--space-24) + env(safe-area-inset-bottom, 0px));
}

/* Screen-reader only utility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Skip Link */
.skip-link {
  position: absolute;
  top: -100px;
  left: var(--space-16);
  z-index: 1000;
  background-color: var(--bg-surface);
  color: var(--text-main);
  padding: var(--space-12) var(--space-16);
  border: 2px solid var(--color-focus);
  border-radius: var(--radius-btn);
  font-weight: 700;
  text-decoration: none;
}

.skip-link:focus {
  top: var(--space-12);
}

/* ==========================================================================
   Layout Containers &amp; Sections
   ========================================================================== */

.container {
  width: 100%;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
  padding-left: 20px;
  padding-right: 20px;
}

@media (min-width: 768px) {
  .container {
    padding-left: var(--space-32);
    padding-right: var(--space-32);
  }
}

.prose {
  max-width: var(--prose-max);
}

.section {
  padding-top: var(--space-48);
  padding-bottom: var(--space-48);
  border-bottom: 1px solid var(--color-border);
}

.section:last-child {
  border-bottom: none;
}

@media (min-width: 768px) {
  .section {
    padding-top: var(--space-80);
    padding-bottom: var(--space-80);
  }
}

.page-header {
  padding-top: var(--space-32);
  padding-bottom: var(--space-32);
  border-bottom: 1px solid var(--color-border);
}

@media (min-width: 768px) {
  .page-header {
    padding-top: var(--space-48);
    padding-bottom: var(--space-48);
  }
}

.note-text {
  font-size: 0.875rem; /* 14px */
  color: var(--text-sub);
  line-height: 1.7;
}

/* ==========================================================================
   Demo Banner &amp; Header
   ========================================================================== */

.demo-banner {
  background-color: var(--color-green);
  color: var(--bg-surface);
  font-size: 0.875rem; /* 14px */
  line-height: 1.6;
  padding: var(--space-8) 20px;
  text-align: center;
}

.demo-banner p {
  margin: 0;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
}

.site-header {
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--color-border);
}

.header-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-12);
  padding-bottom: var(--space-12);
  gap: var(--space-12);
}

.site-logo {
  font-size: 1.375rem; /* 22px */
  font-weight: 700;
  color: var(--text-main);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: var(--space-4) var(--space-8);
  margin-left: -8px;
  border-radius: var(--radius-btn);
}

.site-logo:hover {
  color: var(--color-green);
}

.site-logo[aria-current=&quot;page&quot;] {
  text-decoration: underline;
  text-decoration-color: var(--color-brown);
  text-underline-offset: 6px;
}

/* Mobile Nav Toggle Button */
.nav-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  gap: var(--space-8);
  min-height: 44px;
  min-width: 44px;
  padding: var(--space-8) var(--space-12);
  background-color: var(--bg-base);
  color: var(--text-main);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-btn);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
}

.nav-toggle:hover {
  background-color: var(--color-green-tint);
  border-color: var(--color-green);
}

.nav-toggle-icon {
  display: inline-block;
  width: 16px;
  height: 12px;
  position: relative;
}

.nav-toggle-icon::before,
.nav-toggle-icon::after,
.nav-toggle-icon span {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  width: 100%;
  height: 2px;
  background-color: var(--text-main);
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.nav-toggle-icon::before {
  top: 0;
}

.nav-toggle-icon span {
  top: 5px;
}

.nav-toggle-icon::after {
  bottom: 0;
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon::before {
  transform: translateY(5px) rotate(45deg);
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon span {
  opacity: 0;
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon::after {
  transform: translateY(-5px) rotate(-45deg);
}

/* Global Nav */
.global-nav {
  width: 100%;
}

.global-nav-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.global-nav-link {
  display: flex;
  align-items: center;
  min-height: 44px;
  padding: var(--space-8) var(--space-12);
  color: var(--text-main);
  text-decoration: none;
  font-weight: 600;
  border-radius: var(--radius-btn);
}

.global-nav-link:hover {
  background-color: var(--color-green-tint);
  color: var(--color-green);
}

.global-nav-link[aria-current=&quot;page&quot;] {
  background-color: var(--color-green-tint);
  color: var(--color-green);
  font-weight: 700;
}

/* JS-initialized collapsible behavior on &lt;768px */
@media (max-width: 767px) {
  .site-header.js-nav-ready .nav-toggle {
    display: inline-flex;
  }

  .site-header.js-nav-ready .global-nav {
    display: none;
    padding-top: var(--space-8);
    border-top: 1px solid var(--color-border);
  }

  .site-header.js-nav-ready .global-nav.is-open {
    display: block;
  }
}

@media (min-width: 768px) {
  .nav-toggle {
    display: none !important;
  }

  .global-nav {
    width: auto;
    display: block !important;
  }

  .global-nav-list {
    flex-direction: row;
    align-items: center;
    gap: var(--space-8);
  }
}

/* ==========================================================================
   Buttons &amp; Links
   ========================================================================== */

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-12);
  margin-top: var(--space-24);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  min-width: 44px;
  padding: var(--space-12) var(--space-24);
  font-family: var(--font-sans);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.4;
  text-decoration: none;
  border-radius: var(--radius-btn);
  border: 2px solid transparent;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.btn-primary {
  background-color: var(--color-green);
  color: var(--bg-surface);
  border-color: var(--color-green);
}

.btn-primary:hover {
  background-color: #1A362E;
  border-color: #1A362E;
  color: var(--bg-surface);
}

.btn-secondary {
  background-color: var(--bg-surface);
  color: var(--color-green);
  border-color: var(--color-green);
}

.btn-secondary:hover {
  background-color: var(--color-green-tint);
  color: var(--text-main);
}

.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.section-link-wrap {
  margin-top: var(--space-24);
}

/* ==========================================================================
   Cards &amp; Labels
   ========================================================================== */

.card {
  background-color: var(--bg-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  padding: var(--space-24);
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: var(--space-4) var(--space-8);
  font-size: 0.875rem;
  font-weight: 700;
  line-height: 1.5;
  border-radius: var(--radius-label);
  border: 1px solid transparent;
}

.badge-open {
  background-color: var(--color-green-tint);
  color: var(--color-green);
  border-color: var(--color-green);
}

.badge-closed {
  background-color: var(--color-closed-tint);
  color: var(--color-closed);
  border-color: var(--color-closed);
}

/* ==========================================================================
   Hero &amp; CSS Illustrations (Placeholders)
   ========================================================================== */

.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-32);
  align-items: center;
}

@media (min-width: 768px) {
  .hero-grid {
    grid-template-columns: 1.1fr 0.9fr;
    gap: var(--space-32);
  }
}

@media (min-width: 1024px) {
  .hero-grid {
    gap: var(--space-48);
  }
}

.hero-hours-box {
  background-color: var(--bg-surface);
  border: 1px solid var(--color-border);
  border-left: 4px solid var(--color-green);
  border-radius: var(--radius-btn);
  padding: var(--space-16);
  margin-top: var(--space-24);
}

.hero-hours-main {
  font-weight: 700;
  margin-bottom: var(--space-4);
}

.hero-hours-status {
  font-size: 0.875rem;
  color: var(--text-sub);
  margin-bottom: 0;
}

/* Illustration containers */
.illus-frame {
  position: relative;
  width: 100%;
  background: linear-gradient(160deg, #F5EFE4 0%, #EAE0D0 100%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.illus-ratio-4-3 {
  aspect-ratio: 4 / 3;
  min-height: 210px;
}

.illus-ratio-3-2 {
  aspect-ratio: 3 / 2;
  min-height: 160px;
}

.illus-caption {
  position: absolute;
  bottom: var(--space-8);
  right: var(--space-12);
  font-size: 0.875rem; /* 14px */
  line-height: 1.4;
  color: var(--text-sub);
  background-color: rgba(255, 253, 248, 0.9);
  padding: var(--space-4) var(--space-8);
  border-radius: var(--radius-label);
  border: 1px solid var(--color-border);
}

/* 1. Hero Illustration: Window &amp; Coffee Cup */
.illus-window-scene {

}

.illus-window {

.illus-window::after {

.illus-leaf {

  width: 36px;

.illus-table {

  left: 10px;
  right: 10px;
  height: 14px;
  background-color: var(--color-brown);

}

.illus-cup {
  position: absolute;
  bottom: 30px;
  right: 48px;
  width: 56px;
  height: 42px;
  background-color: var(--bg-surface);
  border: 3px solid var(--color-brown);
  border-radius: 4px 4px 22px 22px;
}

.illus-cup::before {
  content: &quot;&quot;;
  position: absolute;
  top: 6px;
  left: 6px;
  right: 6px;
  height: 8px;
  background-color: var(--color-brown);
  border-radius: 4px;
}

.illus-cup::after {
  content: &quot;&quot;;
  position: absolute;
  top: 8px;
  right: -15px;
  width: 14px;
  height: 20px;
  border: 3px solid var(--color-brown);
  border-left: none;

}

.illus-saucer {
  position: absolute;
  bottom: 24px;
  right: 36px;

/* 2. Toast &amp; Coffee Illustration (Menu) */
.illus-morning-scene {
  position: relative;
  width: 200px;
  height: 120px;
}

.illus-plate {
  position: absolute;
  bottom: 16px;
  left: 16px;
  width: 104px;
  height: 76px;
  background-color: var(--bg-surface);
  border: 3px solid var(--color-border);
  border-radius: 50%;
}

.illus-toast {

  bottom: 28px;
  left: 36px;
  width: 64px;

  background-color: #DFB988;

}

.illus-toast::after {

  top: 14px;
  left: 16px;
  width: 22px;
  height: 18px;

.illus-mug {

  bottom: 24px;

.illus-mug::after {

/* 3. Roaster Illustration (About) */
.illus-roaster-scene {
  position: relative;
  width: 200px;
  height: 140px;
}

.illus-roaster-drum {
  position: absolute;
  bottom: 28px;
  left: 44px;
  width: 84px;
  height: 64px;
  background-color: var(--color-green);
  border: 3px solid var(--text-main);
  border-radius: 12px;
}

.illus-roaster-drum::before {
  content: &quot;&quot;;
  position: absolute;
  top: 14px;
  left: 22px;
  width: 34px;
  height: 34px;
  background-color: var(--color-brown);
  border: 3px solid var(--bg-surface);
  border-radius: 50%;
}

.illus-roaster-hopper {

  top: 16px;
  left: 64px;
  width: 44px;

.illus-roaster-tray {

  bottom: 16px;
  left: 32px;

/* 4. Route Landmarks Illustration (Access) */
.illus-landmarks-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-8);
  width: 100%;
  padding: var(--space-16) var(--space-8) var(--space-48);
}

.illus-landmark-item {
  background-color: var(--bg-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-btn);
  padding: var(--space-12) var(--space-4);

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-8);
}

@media (min-width: 768px) {
  .illus-landmarks-grid {

    padding: var(--space-24) var(--space-16) var(--space-48);

  }
}

.illus-landmark-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.illus-icon-station {
  background-color: var(--color-brown-tint);
  border: 2px solid var(--color-brown);
}

.illus-icon-station::before {
  content: &quot;&quot;;
  width: 20px;

/**
 * ひより珈琲 デモサイト 共通スクリプト (main.js)
 * モバイルナビゲーション開閉・キーボード操作対応
 */
(function () {
  &#x27;use strict&#x27;;

  function initNavigation() {
    var header = document.querySelector(&#x27;.site-header&#x27;);
    var toggleBtn = document.getElementById(&#x27;nav-toggle&#x27;);
    var nav = document.getElementById(&#x27;global-nav&#x27;);

    if (!header || !toggleBtn || !nav) {
      return;
    }

    // JS有効時のみ折りたたみナビを有効化する（JS無効時は常時展開）
    header.classList.add(&#x27;js-nav-ready&#x27;);
    toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    nav.classList.remove(&#x27;is-open&#x27;);

    function closeNav(returnFocus) {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      nav.classList.remove(&#x27;is-open&#x27;);
      if (returnFocus) {
        toggleBtn.focus();
      }
    }

    function openNav() {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      nav.classList.add(&#x27;is-open&#x27;);
    }

    toggleBtn.addEventListener(&#x27;click&#x27;, function () {
      var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      if (isExpanded) {
        closeNav(false);
      } else {
        openNav();
      }
    });

    // Escapeキーでメニューを閉じ、開閉ボタンへフォーカスを戻す
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; || event.key === &#x27;Esc&#x27;) {
        var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        if (isExpanded) {
          event.preventDefault();
          closeNav(true);
        }
      }
    });

    // 768px以上に広がった際は開閉状態をリセット
    if (window.matchMedia) {
      var mq = window.matchMedia(&#x27;(min-width: 768px)&#x27;);
      var handleResize = function (e) {
        if (e.matches) {
          closeNav(false);
        }
      };
      if (typeof mq.addEventListener === &#x27;function&#x27;) {
        mq.addEventListener(&#x27;change&#x27;, handleResize);
      } else if (typeof mq.addListener === &#x27;function&#x27;) {
        mq.addListener(handleResize);
      }
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initNavigation);
  } else {
    initNavigation();
  }
})();

&lt;/script&gt;
&lt;script&gt;
/**
 * ひより珈琲 デモサイト 営業日サンプル描画スクリプト (business-hours.js)
 * 固定対象週: 2026年11月9日（月）〜15日（日）
 * 端末の日時やタイムゾーン変換は使用せず、文字列データをそのまま表示する。
 */
(function () {
  &#x27;use strict&#x27;;

  var TARGET_PERIOD_LABEL = &#x27;表示例：2026年11月9日〜15日&#x27;;
  var COMMON_STATUS_TEXT = &#x27;営業日サンプルを表示しています。&#x27;;

  // 共通の営業日マスターデータ（臨時休業フラグは通常営業より優先される）
  var WEEKLY_SCHEDULE_DATA = [
    {
      dateShort: &#x27;11/9&#x27;,
      dateLong: &#x27;11月9日&#x27;,
      dayOfWeek: &#x27;月&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/10&#x27;,
      dateLong: &#x27;11月10日&#x27;,
      dayOfWeek: &#x27;火&#x27;,
      regularStatus: &#x27;定休日&#x27;,
      regularHours: &#x27;お休み&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/11&#x27;,
      dateLong: &#x27;11月11日&#x27;,
      dayOfWeek: &#x27;水&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/12&#x27;,
      dateLong: &#x27;11月12日&#x27;,
      dayOfWeek: &#x27;木&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: true
    },
    {
      dateShort: &#x27;11/13&#x27;,
      dateLong: &#x27;11月13日&#x27;,
      dayOfWeek: &#x27;金&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/14&#x27;,
      dateLong: &#x27;11月14日&#x27;,
      dayOfWeek: &#x27;土&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/15&#x27;,
      dateLong: &#x27;11月15日&#x27;,
      dayOfWeek: &#x27;日&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    }
  ];

  /**
   * 臨時休業を通常の営業時間より優先して表示用データを解決する
   */
  function resolveDayInfo(item) {
    if (item.isTempClosed) {
      return {
        dateShort: item.dateShort,
        dateLong: item.dateLong,
        dayOfWeek: item.dayOfWeek,
        isOpen: false,
        statusFormal: &#x27;臨時休業&#x27;,
        statusCompact: &#x27;臨休&#x27;,
        hoursText: &#x27;お休み（臨時休業）&#x27;,
        summaryText: &#x27;臨時休業&#x27;
      };
    }

    if (item.regularStatus === &#x27;定休日&#x27;) {
      return {
        dateShort: item.dateShort,
        dateLong: item.dateLong,
        dayOfWeek: item.dayOfWeek,
        isOpen: false,
        statusFormal: &#x27;定休日&#x27;,
        statusCompact: &#x27;定休&#x27;,
        hoursText: &#x27;お休み（毎週火曜）&#x27;,
        summaryText: &#x27;定休日&#x27;
      };
    }

    return {
      dateShort: item.dateShort,
      dateLong: item.dateLong,
      dayOfWeek: item.dayOfWeek,
      isOpen: true,
      statusFormal: &#x27;営業&#x27;,
      statusCompact: &#x27;営業&#x27;,
      hoursText: item.regularHours,
      summaryText: &#x27;営業 &#x27; + item.regularHours
    };
  }

  /**
   * トップページの「今週の営業日」7日分カードを描画
   */
  function renderTopWeeklyList(container) {
    container.innerHTML = &#x27;&#x27;;

    WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
      var day = resolveDayInfo(rawItem);
      var li = document.createElement(&#x27;li&#x27;);
      li.className = &#x27;weekly-card&#x27; + (day.isOpen ? &#x27;&#x27; : &#x27; is-closed&#x27;);

      var dateSpan = document.createElement(&#x27;span&#x27;);
      dateSpan.className = &#x27;weekly-card-date&#x27;;
      dateSpan.textContent = day.dateShort + &#x27;（&#x27; + day.dayOfWeek + &#x27;）&#x27;;

      var bodyDiv = document.createElement(&#x27;div&#x27;);
      bodyDiv.className = &#x27;weekly-card-body&#x27;;

      var badgeSpan = document.createElement(&#x27;span&#x27;);
      badgeSpan.className = &#x27;badge &#x27; + (day.isOpen ? &#x27;badge-open&#x27; : &#x27;badge-closed&#x27;);
      badgeSpan.textContent = day.statusFormal;

      var hoursSpan = document.createElement(&#x27;span&#x27;);
      hoursSpan.className = &#x27;weekly-card-hours&#x27;;
      hoursSpan.textContent = day.hoursText;

      bodyDiv.appendChild(badgeSpan);
      bodyDiv.appendChild(hoursSpan);
      li.appendChild(dateSpan);
      li.appendChild(bodyDiv);
      container.appendChild(li);
    });
  }

  /**
   * 営業日・アクセスページの週カレンダー（7列）と詳細一覧を描画
   */
  function renderAccessCalendar(tableRow, detailList) {
    if (tableRow) {
      tableRow.innerHTML = &#x27;&#x27;;
      WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
        var day = resolveDayInfo(rawItem);
        var td = document.createElement(&#x27;td&#x27;);

        var dateSpan = document.createElement(&#x27;span&#x27;);
        dateSpan.className = &#x27;cal-date&#x27;;
        dateSpan.innerHTML =
          day.dateShort + &#x27;&lt;span class=&quot;sr-only&quot;&gt;（&#x27; + day.dayOfWeek + &#x27;）&lt;/span&gt;&#x27;;

        var statusSpan = document.createElement(&#x27;span&#x27;);
        statusSpan.className =
          &#x27;cal-status &#x27; + (day.isOpen ? &#x27;cal-status-open&#x27; : &#x27;cal-status-closed&#x27;);

        // 画面上はスマホ7列でも収まる短い表記（営業・定休・臨休）、読み上げでは正式な区分名を使用
        if (day.statusCompact !== day.statusFormal) {
          var visualText = document.createElement(&#x27;span&#x27;);
          visualText.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          visualText.textContent = day.statusCompact;

          var srText = document.createElement(&#x27;span&#x27;);
          srText.className = &#x27;sr-only&#x27;;
          srText.textContent = day.statusFormal;

          statusSpan.appendChild(visualText);
          statusSpan.appendChild(srText);
        } else {
          statusSpan.textContent = day.statusFormal;
        }

        var hoursSpan = document.createElement(&#x27;span&#x27;);
        hoursSpan.className = &#x27;cal-hours&#x27;;
        hoursSpan.textContent = day.isOpen ? day.hoursText : &#x27;お休み&#x27;;

        td.appendChild(dateSpan);
        td.appendChild(statusSpan);
        td.appendChild(hoursSpan);
        tableRow.appendChild(td);
      });
    }

    if (detailList) {
      detailList.innerHTML = &#x27;&#x27;;
      WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
        var day = resolveDayInfo(rawItem);
        var li = document.createElement(&#x27;li&#x27;);
        li.className = &#x27;calendar-detail-item&#x27;;

        var dateSpan = document.createElement(&#x27;span&#x27;);
        dateSpan.className = &#x27;calendar-detail-date&#x27;;
        dateSpan.textContent = day.dateShort + &#x27;（&#x27; + day.dayOfWeek + &#x27;）&#x27;;

        var infoDiv = document.createElement(&#x27;div&#x27;);
        infoDiv.className = &#x27;calendar-detail-info&#x27;;

        var badgeSpan = document.createElement(&#x27;span&#x27;);
        badgeSpan.className = &#x27;badge &#x27; + (day.isOpen ? &#x27;badge-open&#x27; : &#x27;badge-closed&#x27;);
        badgeSpan.textContent = day.statusFormal;

        var hoursSpan = document.createElement(&#x27;span&#x27;);
        hoursSpan.className = &#x27;weekly-card-hours&#x27;;
        hoursSpan.textContent = day.hoursText;

        infoDiv.appendChild(badgeSpan);
        infoDiv.appendChild(hoursSpan);
        li.appendChild(dateSpan);
        li.appendChild(infoDiv);
        detailList.appendChild(li);
      });
    }
  }

  function initBusinessHours() {
    var periodElements = document.querySelectorAll(&#x27;[data-hours-period]&#x27;);
    for (var i = 0; i &lt; periodElements.length; i++) {
      periodElements[i].textContent = TARGET_PERIOD_LABEL;
    }

    var statusElements = document.querySelectorAll(&#x27;[data-hours-status]&#x27;);
    for (var j = 0; j &lt; statusElements.length; j++) {
      statusElements[j].textContent = COMMON_STATUS_TEXT;
    }

    var topList = document.getElementById(&#x27;weekly-hours-list&#x27;);
    if (topList) {
      renderTopWeeklyList(topList);
    }

    var calRow = document.getElementById(&#x27;week-calendar-row&#x27;);
    var detailList = document.getElementById(&#x27;access-hours-detail&#x27;);
    if (calRow || detailList) {
      renderAccessCalendar(calRow, detailList);
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initBusinessHours);
  } else {
    initBusinessHours();
  }
})();

&lt;/script&gt;

(function () {
  &#x27;use strict&#x27;;

  function initNavigation() {
    var header = document.querySelector(&#x27;.site-header&#x27;);
    var toggleBtn = document.getElementById(&#x27;nav-toggle&#x27;);
    var nav = document.getElementById(&#x27;global-nav&#x27;);

    if (!header || !toggleBtn || !nav) {
      return;
    }

    // JS有効時のみ折りたたみナビを有効化する（JS無効時は常時展開）
    header.classList.add(&#x27;js-nav-ready&#x27;);
    toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    nav.classList.remove(&#x27;is-open&#x27;);

    function closeNav(returnFocus) {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      nav.classList.remove(&#x27;is-open&#x27;);
      if (returnFocus) {
        toggleBtn.focus();
      }
    }

    function openNav() {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      nav.classList.add(&#x27;is-open&#x27;);
    }

    toggleBtn.addEventListener(&#x27;click&#x27;, function () {
      var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      if (isExpanded) {
        closeNav(false);
      } else {
        openNav();
      }
    });

    // Escapeキーでメニューを閉じ、開閉ボタンへフォーカスを戻す
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; || event.key === &#x27;Esc&#x27;) {
        var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        if (isExpanded) {
          event.preventDefault();
          closeNav(true);
        }
      }
    });

    // 768px以上に広がった際は開閉状態をリセット
    if (window.matchMedia) {
      var mq = window.matchMedia(&#x27;(min-width: 768px)&#x27;);
      var handleResize = function (e) {
        if (e.matches) {
          closeNav(false);
        }
      };
      if (typeof mq.addEventListener === &#x27;function&#x27;) {
        mq.addEventListener(&#x27;change&#x27;, handleResize);
      } else if (typeof mq.addListener === &#x27;function&#x27;) {
        mq.addListener(handleResize);
      }
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initNavigation);
  } else {

  border: 1px solid var(--color-border);
  border-radius: var(--radius-btn);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 700;
  cursor: pointer;
}

.nav-toggle:hover {
  background-color: var(--color-green-tint);
  border-color: var(--color-green);
}

.nav-toggle-icon {
  display: inline-block;
  width: 16px;
  height: 12px;
  position: relative;
}

.nav-toggle-icon::before,
.nav-toggle-icon::after,
.nav-toggle-icon span {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  width: 100%;
  height: 2px;
  background-color: var(--text-main);
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.nav-toggle-icon::before {
  top: 0;
}

.nav-toggle-icon span {
  top: 5px;
}

.nav-toggle-icon::after {
  bottom: 0;
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon::before {
  transform: translateY(5px) rotate(45deg);
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon span {
  opacity: 0;
}

.nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-icon::after {
  transform: translateY(-5px) rotate(-45deg);
}

(function () {
  &#x27;use strict&#x27;;

  function initNavigation() {
    var header = document.querySelector(&#x27;.site-header&#x27;);
    var toggleBtn = document.getElementById(&#x27;nav-toggle&#x27;);
    var nav = document.getElementById(&#x27;global-nav&#x27;);

    if (!header || !toggleBtn || !nav) {
      return;
    }

    // JS有効時のみ折りたたみナビを有効化する（JS無効時は常時展開）
    header.classList.add(&#x27;js-nav-ready&#x27;);
    toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    nav.classList.remove(&#x27;is-open&#x27;);

    function closeNav(returnFocus) {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      nav.classList.remove(&#x27;is-open&#x27;);
      if (returnFocus) {
        toggleBtn.focus();
      }
    }

    function openNav() {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      nav.classList.add(&#x27;is-open&#x27;);
    }

    toggleBtn.addEventListener(&#x27;click&#x27;, function () {
      var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      if (isExpanded) {
        closeNav(false);
      } else {
        openNav();
      }
    });

    // Escapeキーでメニューを閉じ、開閉ボタンへフォーカスを戻す
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; || event.key === &#x27;Esc&#x27;) {
        var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        if (isExpanded) {
          event.preventDefault();
          closeNav(true);
        }
      }
    });

    if (window.matchMedia) {
      var mq = window.matchMedia(&#x27;(min-width: 768px)&#x27;);
      var handleResize = function (e) {
        if (e.matches) {
          closeNav(false);
        }
      };
      if (typeof mq.addEventListener === &#x27;function&#x27;) {
        mq.addEventListener(&#x27;change&#x27;, handleResize);
      } else if (typeof mq.addListener === &#x27;function&#x27;) {
        mq.addListener(handleResize);
      }
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initNavigation);
  } else {

/**
 * ひより珈琲 デモサイト 共通スクリプト (main.js)
 * モバイルナビゲーション開閉・キーボード操作対応
 */
(function () {
  &#x27;use strict&#x27;;

  function initNavigation() {
    var header = document.querySelector(&#x27;.site-header&#x27;);
    var toggleBtn = document.getElementById(&#x27;nav-toggle&#x27;);
    var nav = document.getElementById(&#x27;global-nav&#x27;);

    if (!header || !toggleBtn || !nav) {
      return;
    }

    // JS有効時のみ折りたたみナビを有効化する（JS無効時は常時展開）
    header.classList.add(&#x27;js-nav-ready&#x27;);
    toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    nav.classList.remove(&#x27;is-open&#x27;);

    function closeNav(returnFocus) {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      nav.classList.remove(&#x27;is-open&#x27;);
      if (returnFocus) {
        toggleBtn.focus();
      }
    }

    function openNav() {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      nav.classList.add(&#x27;is-open&#x27;);
    }

    toggleBtn.addEventListener(&#x27;click&#x27;, function () {
      var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      if (isExpanded) {
        closeNav(false);
      } else {
        openNav();
      }
    });

    // Escapeキーでメニューを閉じ、開閉ボタンへフォーカスを戻す
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; || event.key === &#x27;Esc&#x27;) {
        var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        if (isExpanded) {
          event.preventDefault();
          closeNav(true);
        }
      }
    });

    // 768px以上に広がった際は開閉状態をリセット
    if (window.matchMedia) {
      var mq = window.matchMedia(&#x27;(min-width: 768px)&#x27;);
      var handleResize = function (e) {
        if (e.matches) {
          closeNav(false);
        }
      };
      if (typeof mq.addEventListener === &#x27;function&#x27;) {
        mq.addEventListener(&#x27;change&#x27;, handleResize);
      } else if (typeof mq.addListener === &#x27;function&#x27;) {
        mq.addListener(handleResize);
      }
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initNavigation);
  } else {
    initNavigation();
  }
})();

&lt;/script&gt;
&lt;script&gt;
/**
 * ひより珈琲 デモサイト 営業日サンプル描画スクリプト (business-hours.js)
 * 固定対象週: 2026年11月9日（月）〜15日（日）
 * 端末の日時やタイムゾーン変換は使用せず、文字列データをそのまま表示する。
 */
(function () {
  &#x27;use strict&#x27;;

  var TARGET_PERIOD_LABEL = &#x27;表示例：2026年11月9日〜15日&#x27;;
  var COMMON_STATUS_TEXT = &#x27;営業日サンプルを表示しています。&#x27;;

  // 共通の営業日マスターデータ（臨時休業フラグは通常営業より優先される）
  var WEEKLY_SCHEDULE_DATA = [
    {
      dateShort: &#x27;11/9&#x27;,
      dateLong: &#x27;11月9日&#x27;,
      dayOfWeek: &#x27;月&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/10&#x27;,
      dateLong: &#x27;11月10日&#x27;,
      dayOfWeek: &#x27;火&#x27;,
      regularStatus: &#x27;定休日&#x27;,
      regularHours: &#x27;お休み&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/11&#x27;,
      dateLong: &#x27;11月11日&#x27;,
      dayOfWeek: &#x27;水&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/12&#x27;,
      dateLong: &#x27;11月12日&#x27;,
      dayOfWeek: &#x27;木&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: true
    },
    {
      dateShort: &#x27;11/13&#x27;,
      dateLong: &#x27;11月13日&#x27;,
      dayOfWeek: &#x27;金&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/14&#x27;,
      dateLong: &#x27;11月14日&#x27;,
      dayOfWeek: &#x27;土&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    },
    {
      dateShort: &#x27;11/15&#x27;,
      dateLong: &#x27;11月15日&#x27;,
      dayOfWeek: &#x27;日&#x27;,
      regularStatus: &#x27;営業&#x27;,
      regularHours: &#x27;9:00〜17:00&#x27;,
      isTempClosed: false
    }
  ];

  /**
   * 臨時休業を通常の営業時間より優先して表示用データを解決する
   */
  function resolveDayInfo(item) {
    if (item.isTempClosed) {
      return {
        dateShort: item.dateShort,
        dateLong: item.dateLong,
        dayOfWeek: item.dayOfWeek,
        isOpen: false,
        statusFormal: &#x27;臨時休業&#x27;,
        statusCompact: &#x27;臨休&#x27;,
        hoursText: &#x27;お休み（臨時休業）&#x27;,
        summaryText: &#x27;臨時休業&#x27;
      };
    }

    if (item.regularStatus === &#x27;定休日&#x27;) {
      return {
        dateShort: item.dateShort,
        dateLong: item.dateLong,
        dayOfWeek: item.dayOfWeek,
        isOpen: false,
        statusFormal: &#x27;定休日&#x27;,
        statusCompact: &#x27;定休&#x27;,
        hoursText: &#x27;お休み（毎週火曜）&#x27;,
        summaryText: &#x27;定休日&#x27;
      };
    }

    return {
      dateShort: item.dateShort,
      dateLong: item.dateLong,
      dayOfWeek: item.dayOfWeek,
      isOpen: true,
      statusFormal: &#x27;営業&#x27;,
      statusCompact: &#x27;営業&#x27;,
      hoursText: item.regularHours,
      summaryText: &#x27;営業 &#x27; + item.regularHours
    };
  }

  /**
   * トップページの「今週の営業日」7日分カードを描画
   */
  function renderTopWeeklyList(container) {
    container.innerHTML = &#x27;&#x27;;

    WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
      var day = resolveDayInfo(rawItem);
      var li = document.createElement(&#x27;li&#x27;);
      li.className = &#x27;weekly-card&#x27; + (day.isOpen ? &#x27;&#x27; : &#x27; is-closed&#x27;);

      var dateSpan = document.createElement(&#x27;span&#x27;);
      dateSpan.className = &#x27;weekly-card-date&#x27;;
      dateSpan.textContent = day.dateShort + &#x27;（&#x27; + day.dayOfWeek + &#x27;）&#x27;;

      var bodyDiv = document.createElement(&#x27;div&#x27;);
      bodyDiv.className = &#x27;weekly-card-body&#x27;;

      var badgeSpan = document.createElement(&#x27;span&#x27;);
      badgeSpan.className = &#x27;badge &#x27; + (day.isOpen ? &#x27;badge-open&#x27; : &#x27;badge-closed&#x27;);
      badgeSpan.textContent = day.statusFormal;

      var hoursSpan = document.createElement(&#x27;span&#x27;);
      hoursSpan.className = &#x27;weekly-card-hours&#x27;;
      hoursSpan.textContent = day.hoursText;

      bodyDiv.appendChild(badgeSpan);
      bodyDiv.appendChild(hoursSpan);
      li.appendChild(dateSpan);
      li.appendChild(bodyDiv);
      container.appendChild(li);
    });
  }

  /**
   * 営業日・アクセスページの週カレンダー（7列）と詳細一覧を描画
   */
  function renderAccessCalendar(tableRow, detailList) {
    if (tableRow) {
      tableRow.innerHTML = &#x27;&#x27;;
      WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
        var day = resolveDayInfo(rawItem);
        var td = document.createElement(&#x27;td&#x27;);

        var dateSpan = document.createElement(&#x27;span&#x27;);
        dateSpan.className = &#x27;cal-date&#x27;;
        dateSpan.innerHTML =
          day.dateShort + &#x27;&lt;span class=&quot;sr-only&quot;&gt;（&#x27; + day.dayOfWeek + &#x27;）&lt;/span&gt;&#x27;;

        var statusSpan = document.createElement(&#x27;span&#x27;);
        statusSpan.className =
          &#x27;cal-status &#x27; + (day.isOpen ? &#x27;cal-status-open&#x27; : &#x27;cal-status-closed&#x27;);

        // 画面上はスマホ7列でも収まる短い表記（営業・定休・臨休）、読み上げでは正式な区分名を使用
        if (day.statusCompact !== day.statusFormal) {
          var visualText = document.createElement(&#x27;span&#x27;);
          visualText.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          visualText.textContent = day.statusCompact;

          var srText = document.createElement(&#x27;span&#x27;);
          srText.className = &#x27;sr-only&#x27;;
          srText.textContent = day.statusFormal;

          statusSpan.appendChild(visualText);
          statusSpan.appendChild(srText);
        } else {
          statusSpan.textContent = day.statusFormal;
        }

        var hoursSpan = document.createElement(&#x27;span&#x27;);
        hoursSpan.className = &#x27;cal-hours&#x27;;
        hoursSpan.textContent = day.isOpen ? day.hoursText : &#x27;お休み&#x27;;

        td.appendChild(dateSpan);
        td.appendChild(statusSpan);
        td.appendChild(hoursSpan);
        tableRow.appendChild(td);
      });
    }

    if (detailList) {
      detailList.innerHTML = &#x27;&#x27;;
      WEEKLY_SCHEDULE_DATA.forEach(function (rawItem) {
        var day = resolveDayInfo(rawItem);
        var li = document.createElement(&#x27;li&#x27;);
        li.className = &#x27;calendar-detail-item&#x27;;

        var dateSpan = document.createElement(&#x27;span&#x27;);
        dateSpan.className = &#x27;calendar-detail-date&#x27;;
        dateSpan.textContent = day.dateShort + &#x27;（&#x27; + day.dayOfWeek + &#x27;）&#x27;;

        var infoDiv = document.createElement(&#x27;div&#x27;);
        infoDiv.className = &#x27;calendar-detail-info&#x27;;

        var badgeSpan = document.createElement(&#x27;span&#x27;);
        badgeSpan.className = &#x27;badge &#x27; + (day.isOpen ? &#x27;badge-open&#x27; : &#x27;badge-closed&#x27;);
        badgeSpan.textContent = day.statusFormal;

        var hoursSpan = document.createElement(&#x27;span&#x27;);
        hoursSpan.className = &#x27;weekly-card-hours&#x27;;
        hoursSpan.textContent = day.hoursText;

        infoDiv.appendChild(badgeSpan);
        infoDiv.appendChild(hoursSpan);
        li.appendChild(dateSpan);
        li.appendChild(infoDiv);
        detailList.appendChild(li);
      });
    }
  }

  function initBusinessHours() {
    var periodElements = document.querySelectorAll(&#x27;[data-hours-period]&#x27;);
    for (var i = 0; i &lt; periodElements.length; i++) {
      periodElements[i].textContent = TARGET_PERIOD_LABEL;
    }

    var statusElements = document.querySelectorAll(&#x27;[data-hours-status]&#x27;);
    for (var j = 0; j &lt; statusElements.length; j++) {
      statusElements[j].textContent = COMMON_STATUS_TEXT;
    }

    var topList = document.getElementById(&#x27;weekly-hours-list&#x27;);
    if (topList) {

/**
 * ひより珈琲 デモサイト 共通スクリプト (main.js)
 * モバイルナビゲーション開閉・キーボード操作対応
 */
(function () {
  &#x27;use strict&#x27;;

  function initNavigation() {
    var header = document.querySelector(&#x27;.site-header&#x27;);
    var toggleBtn = document.getElementById(&#x27;nav-toggle&#x27;);
    var nav = document.getElementById(&#x27;global-nav&#x27;);

    if (!header || !toggleBtn || !nav) {
      return;
    }

    // JS有効時のみ折りたたみナビを有効化する（JS無効時は常時展開）
    header.classList.add(&#x27;js-nav-ready&#x27;);
    toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
    nav.classList.remove(&#x27;is-open&#x27;);

    function closeNav(returnFocus) {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      nav.classList.remove(&#x27;is-open&#x27;);
      if (returnFocus) {
        toggleBtn.focus();
      }
    }

    function openNav() {
      toggleBtn.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      nav.classList.add(&#x27;is-open&#x27;);
    }

    toggleBtn.addEventListener(&#x27;click&#x27;, function () {
      var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      if (isExpanded) {
        closeNav(false);
      } else {
        openNav();
      }
    });

    // Escapeキーでメニューを閉じ、開閉ボタンへフォーカスを戻す
    document.addEventListener(&#x27;keydown&#x27;, function (event) {
      if (event.key === &#x27;Escape&#x27; || event.key === &#x27;Esc&#x27;) {
        var isExpanded = toggleBtn.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        if (isExpanded) {
          event.preventDefault();
          closeNav(true);
        }
      }
    });

    // 768px以上に広がった際は開閉状態をリセット
    if (window.matchMedia) {
      var mq = window.matchMedia(&#x27;(min-width: 768px)&#x27;);
      var handleResize = function (e) {
        if (e.matches) {
          closeNav(false);
        }
      };
      if (typeof mq.addEventListener === &#x27;function&#x27;) {
        mq.addEventListener(&#x27;change&#x27;, handleResize);
      } else if (typeof mq.addListener === &#x27;function&#x27;) {
        mq.addListener(handleResize);
      }
    }
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initNavigation);
  } else {
    initNavigation();
  }
})();

&lt;/script&gt;
&lt;script&gt;
/**
 * ひより珈琲 デモサイト お問い合わせ・予約フォームモック (contact.js)
 * 実際の通信・保存・URL変更・コンソール出力は一切行わない。
 */
(function () {
  &#x27;use strict&#x27;;

  var EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function initContactForm() {
    var form = document.getElementById(&#x27;contact-form&#x27;);
    var submitBtn = document.getElementById(&#x27;contact-submit&#x27;);

    if (!form || !submitBtn) {
      return;
    }

    var nameInput = document.getElementById(&#x27;contact-name&#x27;);
    var emailInput = document.getElementById(&#x27;contact-email&#x27;);
    var topicSelect = document.getElementById(&#x27;contact-topic&#x27;);
    var conditionalGroup = document.getElementById(&#x27;conditional-seat-fields&#x27;);
    var dateInput = document.getElementById(&#x27;contact-date&#x27;);
    var guestsSelect = document.getElementById(&#x27;contact-guests&#x27;);
    var messageInput = document.getElementById(&#x27;contact-message&#x27;);
    var confirmCheckbox = document.getElementById(&#x27;contact-confirm&#x27;);

    var errorBanner = document.getElementById(&#x27;form-error-summary&#x27;);
    var successBanner = document.getElementById(&#x27;form-result&#x27;);

    // カスタムバリデーションを使用
    form.noValidate = true;

    // ご用件に応じた「ご希望日」「人数」欄の表示切替
    function updateConditionalFields() {
      if (!topicSelect || !conditionalGroup) {
        return;
      }
      if (topicSelect.value === &#x27;seat&#x27;) {
        conditionalGroup.hidden = false;
      } else {
        conditionalGroup.hidden = true;
        if (dateInput) {
          dateInput.value = &#x27;&#x27;;
        }
        if (guestsSelect) {
          guestsSelect.value = &#x27;&#x27;;
        }
      }
    }

    if (topicSelect) {
      topicSelect.addEventListener(&#x27;change&#x27;, updateConditionalFields);
      updateConditionalFields();
    }

    function setFieldError(inputEl, errorElId, message) {
      var errorEl = document.getElementById(errorElId);
      if (!inputEl || !errorEl) {
        return;
      }
      var hintId = inputEl.getAttribute(&#x27;data-hint-id&#x27;);
      if (message) {
        inputEl.setAttribute(&#x27;aria-invalid&#x27;, &#x27;true&#x27;);
        errorEl.textContent = message;
        errorEl.hidden = false;
        var describedBy = hintId ? hintId + &#x27; &#x27; + errorElId : errorElId;
        inputEl.setAttribute(&#x27;aria-describedby&#x27;, describedBy);
      } else {
        inputEl.setAttribute(&#x27;aria-invalid&#x27;, &#x27;false&#x27;);
        errorEl.textContent = &#x27;&#x27;;
        errorEl.hidden = true;
        if (hintId) {
          inputEl.setAttribute(&#x27;aria-describedby&#x27;, hintId);
        } else {
          inputEl.removeAttribute(&#x27;aria-describedby&#x27;);
        }
      }
    }

    function clearAllFeedback() {
      setFieldError(nameInput, &#x27;contact-name-error&#x27;, &#x27;&#x27;);
      setFieldError(emailInput, &#x27;contact-email-error&#x27;, &#x27;&#x27;);
      setFieldError(topicSelect, &#x27;contact-topic-error&#x27;, &#x27;&#x27;);
      setFieldError(messageInput, &#x27;contact-message-error&#x27;, &#x27;&#x27;);
      setFieldError(confirmCheckbox, &#x27;contact-confirm-error&#x27;, &#x27;&#x27;);

      if (errorBanner) {
        errorBanner.textContent = &#x27;&#x27;;
        errorBanner.hidden = true;
      }
      if (successBanner) {
        successBanner.textContent = &#x27;&#x27;;
        successBanner.hidden = true;
      }
    }

    form.addEventListener(&#x27;submit&#x27;, function (event) {
      event.preventDefault();
      clearAllFeedback();

      var firstInvalidField = null;

      // 1. お名前（必須・空白のみ不可・100文字以内）
      var nameRaw = nameInput ? nameInput.value : &#x27;&#x27;;
      var nameTrimmed = nameRaw.trim();
      if (!nameTrimmed) {
        setFieldError(
          nameInput,
          &#x27;contact-name-error&#x27;,
          &#x27;お名前を入力してください（空白のみの入力はできません）。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = nameInput;
      } else if (nameRaw.length &gt; 100) {
        setFieldError(
          nameInput,
          &#x27;contact-name-error&#x27;,
          &#x27;お名前は100文字以内で入力してください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = nameInput;
      }

      // 2. メールアドレス（必須・空白のみ不可・254文字以内・形式チェック）
      var emailRaw = emailInput ? emailInput.value : &#x27;&#x27;;
      var emailTrimmed = emailRaw.trim();
      if (!emailTrimmed) {
        setFieldError(
          emailInput,
          &#x27;contact-email-error&#x27;,
          &#x27;メールアドレスを入力してください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = emailInput;
      } else if (emailTrimmed.length &gt; 254 || !EMAIL_PATTERN.test(emailTrimmed)) {
        setFieldError(
          emailInput,
          &#x27;contact-email-error&#x27;,
          &#x27;メールアドレスを正しい形式（例：sample@example.com・254文字以内）で入力してください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = emailInput;
      }

      // 3. ご用件（必須）
      var topicVal = topicSelect ? topicSelect.value : &#x27;&#x27;;
      if (topicVal !== &#x27;inquiry&#x27; &amp;&amp; topicVal !== &#x27;seat&#x27;) {
        setFieldError(
          topicSelect,
          &#x27;contact-topic-error&#x27;,
          &#x27;ご用件を選択してください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = topicSelect;
      }

      // 4. お問い合わせ内容（必須・空白のみ不可・1000文字以内）
      var msgRaw = messageInput ? messageInput.value : &#x27;&#x27;;
      var msgTrimmed = msgRaw.trim();
      if (!msgTrimmed) {
        setFieldError(
          messageInput,
          &#x27;contact-message-error&#x27;,
          &#x27;お問い合わせ内容を入力してください（空白のみの入力はできません）。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = messageInput;
      } else if (msgRaw.length &gt; 1000) {
        setFieldError(
          messageInput,
          &#x27;contact-message-error&#x27;,
          &#x27;お問い合わせ内容は1000文字以内で入力してください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = messageInput;
      }

      // 5. デモの確認（必須）
      var isConfirmed = confirmCheckbox ? confirmCheckbox.checked : false;
      if (!isConfirmed) {
        setFieldError(
          confirmCheckbox,
          &#x27;contact-confirm-error&#x27;,
          &#x27;デモの確認チェックボックスにチェックを入れてください。&#x27;
        );
        if (!firstInvalidField) firstInvalidField = confirmCheckbox;
      }

      // エラーがある場合は要約を表示し、最初の不正項目へフォーカス移動
      if (firstInvalidField) {
        if (errorBanner) {
          errorBanner.textContent = &#x27;入力内容をご確認ください。&#x27;;
          errorBanner.hidden = false;
        }
        firstInvalidField.focus();
        return;
      }

      // 成功時：入力をクリアし、モック完了メッセージを通知（入力内容は転載しない）
      form.reset();
      updateConditionalFields();

      if (successBanner) {
        successBanner.textContent =
          &#x27;送信デモが完了しました。内容は送信・保存されていません。予約は成立していません。&#x27;;
        successBanner.hidden = false;
      }
    });

    // submit処理を登録してから送信ボタンを有効化する
    submitBtn.disabled = false;
  }

  if (document.readyState === &#x27;loading&#x27;) {
    document.addEventListener(&#x27;DOMContentLoaded&#x27;, initContactForm);
  } else {
    initContactForm();
  }
})();

&lt;/script&gt;

&lt;script&gt;
document.addEventListener(&#x27;click&#x27;, function (e) {
  var a = e.target.closest(&#x27;a[href]&#x27;);
  if (!a) return;
  var m = a.getAttribute(&#x27;href&#x27;).match(/^([a-z]+)\.html(?:#(.*))?$/);
  if (m) {
    e.preventDefault();
    parent.postMessage({ hiyoriNav: { page: m[1], anchor: m[2] || null } }, &#x27;*&#x27;);
  }
});
window.addEventListener(&#x27;message&#x27;, function (e) {
  if (e.data &amp;&amp; e.data.hiyoriScroll) {
    var el = document.getElementById(e.data.hiyoriScroll);
    if (el) el.scrollIntoView();
  }
});
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>

<script>
var frames = {};
document.querySelectorAll('iframe').forEach(function (f) { frames[f.dataset.page] = f; });
function show(page, anchor) {
  if (!frames[page]) return;
  document.querySelectorAll('iframe').forEach(function (f) { f.classList.remove('active'); });
  frames[page].classList.add('active');
  frames[page].contentWindow.scrollTo(0, 0);
  if (anchor) {
    setTimeout(function () {
      frames[page].contentWindow.postMessage({ hiyoriScroll: anchor }, '*');
    }, 60);
  }
}
window.addEventListener('message', function (e) {
  if (e.data && e.data.hiyoriNav) show(e.data.hiyoriNav.page, e.data.hiyoriNav.anchor);
});
</script>
